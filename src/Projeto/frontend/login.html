<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faça login no DevUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <!-- Botão de Voltar para a Home -->
  <a href="index.html" class="back-btn" aria-label="Voltar para a página inicial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </a>

  <!-- Card Principal de Login -->
  <div class="auth-wrapper">
    <main class="auth-card">
      <header class="card-header">
        <img src="logo.png" alt="DevUp Logo" class="auth-logo">
        <h1 class="card-title">Faça login no DevUp</h1>
        <p class="card-subtitle">Faça login para acessar sua conta e usar todos os recursos</p>
      </header>

      <!-- Botão Google -->
      <button type="button" class="btn-google">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue com o Google</span>
      </button>

      <!-- Divisor "ou" -->
      <div class="auth-divider">ou</div>

      <!-- Formulário de Login -->
      <form class="auth-form" action="login.html" method="GET" onsubmit="window.location.href='cliente.html'; return false;">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="email@gmail.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="password">Senha</label>
            <a href="#" class="forgot-link">Esqueceu a senha?</a>
          </div>
          <input type="password" id="password" name="password" class="form-input" placeholder="• • • • • •" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <span>Faça login com o Email</span>
        </button>
      </form>

      <!-- Rodapé do Card -->
      <p class="auth-terms">
        Ao iniciar sessão, você concorda com nossos<br>
        Termos de Serviço e Política de Privacidade.
      </p>

      <p class="auth-switch">
        Caso não tenha login, clique em <a href="cadastro.html">Criar Conta</a>
      </p>
    </main>
  </div>

</body>
</html>
